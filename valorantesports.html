<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>VALORANT ESPOR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="valorantespor">

    <!-- Yayın ve Sohbeti yan yana tutan ana kapsayıcı -->
    <div class="espor-ana-kriter">

        <!-- Yayın Kutusu ve Çerçeve -->
        <div class="valorant-yayin-kutusu">
            <!-- Twitch canlı yayın -->
            <iframe src="https://player.twitch.tv/?channel=valorant&parent=localhost"
                    allowfullscreen>
            </iframe>

            <!-- Yayın etrafındaki frame (Resim yolunun doğruluğundan emin ol) -->
            <img src="valorantframegptt.png" alt="Valorant yayın çerçevesi" class="valorant-frame">
        </div>

        <!-- Twitch Chat Kutusu -->
        <div class="valorant-chat-kutusu">
            <iframe src="https://www.twitch.tv/embed/valorant/chat?parent=localhost"
                    height="550"
                    width="350">
            </iframe>
        </div>

    </div>

</body>

</html>
