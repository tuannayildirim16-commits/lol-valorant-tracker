        function sekmeDegis(event, sekmeId) {
            const icerikler = document.querySelectorAll('.sekme-icerik');
            icerikler.forEach(ic => ic.classList.remove('aktif-icerik'));

            const butonlar = document.querySelectorAll('.sekme-btn');
            butonlar.forEach(btn => btn.classList.remove('aktif'));

            document.getElementById(sekmeId).classList.add('aktif-icerik');
            event.currentTarget.classList.add('aktif');
        }

        // Şampiyonları yükleme
        const champGrid = document.getElementById('champGrid');
        eskiSampiyonlar.forEach(champ => {
            const card = document.createElement('div');
            card.className = 'champ-card';
            card.innerHTML = `<img src="${champ.resim}" alt="${champ.ad}">`;
            card.onclick = () => {
                document.getElementById('previewImg').src = champ.resim;
                document.getElementById('previewName').innerText = champ.ad;
                document.getElementById('previewDesc').innerText = champ.aciklama;
            };
            champGrid.appendChild(card);
        });

        // İlk şampiyonu varsayılan seçili yap
        if (eskiSampiyonlar.length > 0) {
            document.getElementById('previewImg').src = eskiSampiyonlar[0].resim;
            document.getElementById('previewName').innerText = eskiSampiyonlar[0].ad;
            document.getElementById('previewDesc').innerText = eskiSampiyonlar[0].aciklama;
        }

        // İtemleri yükleme
        const itemListesi = document.getElementById('item-listesi-kapsayici');
        eskiItemler.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item-karti';
            itemDiv.innerHTML = `
                    <img src="${item.resim}" alt="${item.ad}">
                    <div class="tooltip-aciklama"><strong>${item.ad}</strong><br>${item.aciklama}</div>
                `;
            itemListesi.appendChild(itemDiv);
        });
    </script>
